name: Deploy Frontend to K8s

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nextjs-frontend:latest

      - name: Deploy to K8s Master via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.K8S_MASTER_IP }}
          username: ${{ secrets.K8S_SSH_USER }}
          key: ${{ secrets.K8S_SSH_KEY }}
          port: 22
          script: |
            cat <<'EOF' | sed "s|DOCKERHUB_USERNAME|${{ secrets.DOCKERHUB_USERNAME }}|g" | kubectl apply -f -
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: nextjs-frontend
              namespace: three-tier-app
            spec:
              replicas: 2
              selector:
                matchLabels:
                  app: frontend
              template:
                metadata:
                  labels:
                    app: frontend
                spec:
                  containers:
                    - name: frontend
                      image: DOCKERHUB_USERNAME/nextjs-frontend:latest
                      imagePullPolicy: Always
                      ports:
                        - containerPort: 3000
            ---
            apiVersion: v1
            kind: Service
            metadata:
              name: frontend-service
              namespace: three-tier-app
            spec:
              type: NodePort
              ports:
                - port: 3000
                  targetPort: 3000
                  nodePort: 30007
              selector:
                app: frontend
            EOF
            kubectl rollout restart deployment/nextjs-frontend -n three-tier-app
            kubectl rollout status deployment/nextjs-frontend -n three-tier-app --timeout=120s
